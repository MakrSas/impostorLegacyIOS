name: Build iOS

on:
  # Run automatically when pushing to the iOS work branch so fixes are tested immediately
  push:
    branches:
      - claude/ios-github-actions-build-aqrnrt
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # For release builds
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

jobs:
  buildiOS:
    runs-on: macos-latest
    # Hard ceiling so a hung native rebuild can never burn hours of runner time
    timeout-minutes: 120

    env:
      # Speed up the hxcpp native compilation
      HXCPP_COMPILE_THREADS: "4"

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@main

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      # Cache the project-local .haxelib (Lime/OpenFL/... Git checkouts *and* the
      # native libraries we rebuild below) so only the very first run pays the
      # cost of compiling Lime's native stack. Keyed on the pinned library set.
      - name: Cache haxelib + native libs
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-ios-${{ hashFiles('.hxpkg') }}-v1

      - name: Install libraries
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg
          haxelib run hxpkg install
          # Needed to rebuild the Lime host/native libraries from the Git checkout
          haxelib install format --quiet
          haxelib install hxp --quiet
          haxelib install svg --quiet
          # macOS has no GNU `timeout`; coreutils provides `gtimeout`
          brew install coreutils

      # hxpkg clones Lime via `haxelib git` WITHOUT submodules, but Lime keeps its
      # third-party native sources (jpeg, sdl, openal, freetype, ...) in submodules.
      # Without them `lime rebuild` fails instantly on e.g. "jpeglib.h not found".
      - name: Fetch Lime native submodules
        run: |
          for lib in lime openfl; do
            dir=".haxelib/$lib/git"
            if [ -d "$dir/.git" ] || [ -f "$dir/.git" ]; then
              echo "== submodules for $lib =="
              git -C "$dir" submodule sync --recursive || true
              git -C "$dir" submodule update --init --recursive --depth 1 || true
            fi
          done

      # Lime is installed from Git and ships no prebuilt native libraries, so we
      # build them from source once (then reuse them from the cache above):
      #  - tools: the neko command-line tool
      #  - macos: the host lime.ndll (CFFI) that every lime command loads
      #  - ios:   the iOS native libraries linked into the app
      # Each is time-boxed so a hang fails fast instead of running for hours.
      - name: Rebuild Lime tools
        run: haxelib run lime rebuild tools

      - name: Rebuild Lime host native library
        run: |
          if ls .haxelib/lime/git/ndll/Mac*/lime.ndll >/dev/null 2>&1; then
            echo "Host lime.ndll already present (cache hit), skipping."
          else
            gtimeout -k 60 3000 haxelib run lime rebuild macos
          fi

      # Xcode 16 rejects returning `const char *` (from -UTF8String) as `char *`.
      # The pinned Lime fork's iOS System.mm predates that, so add the cast.
      - name: Patch Lime iOS native source for modern Xcode
        run: |
          SYS=$(find .haxelib/lime -name 'System.mm' -path '*ios*' | head -n1)
          echo "Patching: $SYS"
          if [ -n "$SYS" ]; then
            perl -pi -e 's/return\s+(\[[^;]*UTF8String\]);/return (char *)$1;/ if /UTF8String\];/ && !m{\(char \*\)};' "$SYS"
            grep -n 'UTF8String' "$SYS" || true
          fi

      - name: Rebuild Lime iOS native libraries
        run: |
          if ls .haxelib/lime/git/ndll/iPhone*/*.a >/dev/null 2>&1; then
            echo "iOS native libs already present (cache hit), skipping."
          else
            gtimeout -k 60 3600 haxelib run lime rebuild ios
          fi

      - name: Setup lime
        run: haxelib run lime setup -y

      # iOS device builds need code signing, which a fork's CI has no certificate for.
      # -nosign produces an unsigned .app that we package into an .ipa manually.
      - name: Compile (unsigned)
        run: haxelib run lime build ios -release -nosign ${{ inputs.buildFlags }}

      - name: Package unsigned IPA
        run: |
          APP_DIR=$(find export -type d -name "*.app" -path "*iphoneos*" | head -n1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find export -type d -name "*.app" | head -n1)
          fi
          echo "Found .app: $APP_DIR"
          if [ -z "$APP_DIR" ]; then
            echo "No .app produced by the build!"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr ImpostorLegacy-unsigned.ipa Payload
          ls -lh ImpostorLegacy-unsigned.ipa

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmv-ios-unsigned
          path: ImpostorLegacy-unsigned.ipa
          retention-days: 30
